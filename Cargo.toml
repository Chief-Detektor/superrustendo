[package]
name = "superrustendo"
version = "0.1.0"
authors = ["Andre Rosenhammer <andre.rosenhammer@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Chief-Detektor/superrustendo"
readme = "README.MD"

[lib]
name = "superrustendo"
crate-type = ["dylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
gui = ["minifb"]

[dependencies]
# bitpat = "0.1.1"
byte_struct = "0.7.1"
byteorder = "1.4.3"
hex = "0.4.3"
minifb = { version = "0.25.0", optional = true }
raw-string = "0.3.5"
rustyline = "9.0.0"
#snes-apu = "0.1.12"
#cpal = "0.4.4"
#futures = "0.1.1"
# bit_field = "0.10.0"

[dev-dependencies]
